services:
  - type: web
    name: jobjugaad-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobjugaad-db
          property: connectionString

databases:
  - name: jobjugaad-db
    plan: free
    databaseName: jobjugaad
    ipAllowList: []
